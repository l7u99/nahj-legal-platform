name: Validate Nahj Legal Platform

on:
  pull_request:
    branches: [main]
  push:
    branches: [safe/advocacy-submission-audit, feature/athar-identity-dashboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --node-modules-dir=none supabase/functions/submit-advocacy/index.ts
          deno check --node-modules-dir=none supabase/functions/impact-assistant/index.ts
          deno check --node-modules-dir=none supabase/functions/admin-ai-usage/index.ts
